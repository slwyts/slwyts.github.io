<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash 订阅导入</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .overlay { /*覆盖层样式不变*/
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(5px);
            background-color: rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container { /*容器样式不变*/
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            backdrop-filter: blur(2px);
        }

        #importButton { /*按钮样式不变*/
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        #importButton:hover {
            background-color: #0056b3;
        }

        #subscriptionLink { /*链接样式不变*/
            margin-top: 10px;
            font-style: italic;
            color: #555;
            word-wrap: break-word;
            max-width: 80vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        h1{ /*标题样式不变*/
            text-shadow: 2px 2px 4px #000000;
        }
    </style>
</head>
<body>
    <div class="overlay">
    <div class="container">
        <h1>Clash 订阅快速导入</h1>
        <p>点击下方按钮将订阅链接导入到 Clash。</p>
        <div id="subscriptionLink"></div>
        <a id="importButton" href="#">导入到 Clash</a>
    </div>
    </div>
    <script>
        const body = document.body;
        const portraitBackground = "https://i0.hdslb.com/bfs/new_dyn/f75b255a8d7cee3964a4132f0867cf8e6823116.png";
        const landscapeBackground = "https://i0.hdslb.com/bfs/new_dyn/5737860e28f6ecf50f23fc297c4794fe6823116.png";

        function setBackground() {
            if (window.matchMedia('(orientation: portrait)').matches) {
                body.style.backgroundImage = `url(${portraitBackground})`;
            } else {
                body.style.backgroundImage = `url(${landscapeBackground})`;
            }
        }

        // 初始设置背景
        setBackground();

        // 监听屏幕方向变化
        window.addEventListener('resize', setBackground);


        const urlParams = new URLSearchParams(window.location.search);
        const subscriptionUrl = urlParams.get('');

        const importButton = document.getElementById('importButton');
        const subscriptionLinkDisplay = document.getElementById('subscriptionLink');

        if (subscriptionUrl) {
            const clashUrl = `clash://install-config?url=${encodeURIComponent(subscriptionUrl)}`;
            importButton.href = clashUrl;
            subscriptionLinkDisplay.textContent = decodeURIComponent(subscriptionUrl);
        } else {
            importButton.textContent = "未检测到订阅链接";
            importButton.style.backgroundColor = "#ccc";
            importButton.style.cursor = "default";
            importButton.removeAttribute("href");
            subscriptionLinkDisplay.textContent = "请在URL中添加订阅链接，例如：?https://example.com/sub";
        }
    </script>
</body>
</html>
